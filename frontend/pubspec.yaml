name: rbac_board_scanner
description: "Secure Role-Based Classroom Board Scanner Mobile Application"
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Database & Offline Storage
  sqflite: ^2.3.2
  path: ^1.9.0
  flutter_secure_storage: ^9.0.0
  
  # System Tools
  camera: ^0.10.5+9
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  image: ^4.1.7 # custom dart-based filters and manipulation
  share_plus: ^7.2.1
  
  # Google ML Kit (OCR & Scans)
  google_mlkit_text_recognition: ^0.11.0
  
  # HTTP API Requests
  http: ^1.2.0
  
  # UI & Design Components
  google_fonts: ^6.1.0
  intl: ^0.19.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  flutter_foreground_task: ^8.17.0
  socket_io_client: ^3.0.2
  mime: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/placeholders/
